<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理员端</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      /* analytics panel styles (embedded) */
      .analytics-container{max-width:1200px;margin:0 auto;padding:20px}
      .dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:30px}
      .stat-card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:20px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.1)}
      .stat-card h3{margin:0 0 10px;color:#666;font-size:14px;text-transform:uppercase;font-weight:400}
      .stat-card .value{font-size:32px;font-weight:700;color:#333;margin:10px 0}
      .stat-card .subtext{font-size:12px;color:#999}
      .stat-pending .value{color:#f59e0b}.stat-approved .value{color:#10b981}.stat-rejected .value{color:#ef4444}
      .filter-section{background:#f9fafb;border-radius:8px;padding:20px;margin-bottom:20px}
      .filter-row{display:flex;gap:15px;align-items:flex-end;flex-wrap:wrap}
      .filter-row>div{display:flex;flex-direction:column;gap:5px}
      .filter-row label{font-size:13px;font-weight:600;color:#333}
      .filter-row input,.filter-row select{padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:13px}
      .filter-row button{padding:8px 16px;background:#3b82f6;color:#fff;border:0;border-radius:4px;cursor:pointer;font-size:13px}
      .btn-export{background:#10b981 !important}.btn-export:hover{background:#059669}
      .charts-section{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px;margin-bottom:30px}
      .chart-card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:20px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
      .chart-card h3{margin:0 0 20px;font-size:16px;color:#333;font-weight:600}
      .chart-placeholder{width:100%;height:250px;background:#f0f0f0;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px}
      .status-chart{display:flex;gap:20px;align-items:flex-end;height:200px}
      .status-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px}
      .bar-visual{width:100%;background:#e5e7eb;border-radius:4px;overflow:hidden}
      .bar-fill{height:40px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600}
      .bar-label{font-size:12px;color:#666;text-align:center;width:100%}
      .timeline-chart{position:relative;height:200px;margin-bottom:20px}
      .field-stats-section{background:#fff;border:1px solid #ddd;border-radius:8px;padding:20px;margin-bottom:30px}
      .field-selector label{display:block;font-size:13px;font-weight:600;color:#333;margin-bottom:8px}
      .stats-table{width:100%;border-collapse:collapse}
      .stats-table th{background:#f9fafb;border-bottom:2px solid #e5e7eb;padding:12px;text-align:left;font-weight:600;font-size:13px;color:#333}
      .stats-table td{border-bottom:1px solid #e5e7eb;padding:12px;font-size:13px}
      .progress-bar{Width:100%;height:20px;background:#e5e7eb;border-radius:4px;overflow:hidden}
      .progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#2563eb);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600}
      @media (max-width:760px){.analytics-container{padding:15px}.dashboard-grid{grid-template-columns:1fr}.charts-section{grid-template-columns:1fr}.filter-row{flex-direction:column}.filter-row>div{width:100%}.filter-row input,.filter-row select,.filter-row button{width:100%}}
    </style>
  </head>
  <body>
    <div class="container">
      <h1>后台管理员端 <span class="tag">Demo</span></h1>
      <p id="debugVersion" class="version-debug">版本: 加载中...</p>
      <div class="nav">
        <button id="tabFields">字段配置</button>
        <button id="tabList" class="active">申请列表</button>
        <button id="tabCalendar">日历视图</button>
        <button id="tabNotice">须知配置</button>
        <button id="tabAnalytics">数据统计</button>
      </div>

      <section id="panelFields" class="card hidden">
        <h2 id="fieldFormTitle">新增字段</h2>
        <div class="row two">
          <div>
            <label>字段 key</label>
            <input id="fKey" placeholder="例如 company_name" />
          </div>
          <div>
            <label>字段名称</label>
            <input id="fLabel" placeholder="例如 公司名称" />
          </div>
          <div>
            <label>类型</label>
            <select id="fType">
              <option value="text">文字填空</option>
              <option value="number">数字</option>
              <option value="date">日期</option>
              <option value="time">时间</option>
              <option value="select">选择</option>
              <option value="file">文件上传</option>
            </select>
          </div>
          <div>
            <label>是否必填</label>
            <select id="fRequired">
              <option value="true">是</option>
              <option value="false">否</option>
            </select>
          </div>
        </div>
        <div id="optWrap" style="margin-top: 10px" class="hidden">
          <label>选择项</label>
          <div class="option-editor-row">
            <input id="fOptionInput" placeholder="输入一个选项" />
            <button id="addOptionBtn" class="secondary" type="button">添加</button>
          </div>
          <div id="optionList" class="option-list" style="margin-top: 8px"></div>
        </div>
        <div id="numWrap" style="margin-top: 10px" class="hidden">
          <label>数字范围（可选）</label>
          <div class="row two">
            <div>
              <label>最小值</label>
              <input id="fNumberMin" type="number" placeholder="例如 10" />
            </div>
            <div>
              <label>最大值</label>
              <input id="fNumberMax" type="number" placeholder="例如 50" />
            </div>
          </div>
        </div>
        <div class="actions" style="margin-top: 10px">
          <button id="saveFieldBtn" type="button">保存字段</button>
          <button id="cancelEditBtn" class="secondary hidden" type="button">取消编辑</button>
        </div>

        <h2 style="margin-top: 20px">当前字段</h2>
        <div id="fieldRows" class="admin-card-list"></div>
      </section>

      <section id="panelList" class="card">
        <h2>申请列表</h2>
        <div class="row two">
          <div>
            <label>开始日期（按访问时间）</label>
            <div class="date-input-group">
              <button id="openFromDateBtn" class="secondary date-open-btn" type="button">日历</button>
              <input id="qFromDate" type="date" />
            </div>
          </div>
          <div>
            <label>结束日期</label>
            <div class="date-input-group">
              <button id="openToDateBtn" class="secondary date-open-btn" type="button">日历</button>
              <input id="qToDate" type="date" />
            </div>
          </div>
        </div>
        <div class="actions quick-range-row" style="margin-top: 10px">
          <button id="range3dBtn" class="secondary" type="button">三天内</button>
          <button id="range7dBtn" class="secondary" type="button">一周内</button>
          <button id="range30dBtn" class="secondary" type="button">一月内</button>
        </div>
        <div style="margin-top: 10px">
          <label>审批状态</label>
          <select id="qStatus">
            <option value="">全部</option>
            <option value="pending">待审批</option>
            <option value="approved">已通过</option>
            <option value="rejected">已驳回</option>
          </select>
        </div>
        <div style="margin-top: 10px">
          <label>关键词（匹配填写内容或文件名）</label>
          <input id="qKeyword" placeholder="例如 张三 / 会议 / 合同.pdf" />
        </div>
        <div class="actions" style="margin: 10px 0">
          <button id="searchListBtn" type="button">查询</button>
        </div>
        <div id="appRows" class="admin-card-list"></div>
        <div class="actions" style="margin-top: 10px">
          <button id="prevPageBtn" class="secondary" type="button">上一页</button>
          <button id="nextPageBtn" class="secondary" type="button">下一页</button>
          <span id="pageInfo" class="tag">第 1 / 1 页</span>
        </div>
      </section>

      <section id="panelCalendar" class="card hidden">
        <h2>日历视图</h2>
        <p class="hint">已通过审批的日期会高亮，并显示对应单位名称。</p>
        <div class="row two">
          <div class="month-load-col">
            <label>月份 (YYYY-MM)</label>
            <div class="month-load-row">
              <input id="calMonth" />
              <button id="loadCalBtn" type="button">加载日历</button>
            </div>
          </div>
          <div class="month-nav-col">
            <label>月份切换</label>
            <div class="month-nav-row">
              <button id="prevMonthBtn" class="secondary" type="button">上一月</button>
              <button id="nextMonthBtn" class="secondary" type="button">下一月</button>
            </div>
          </div>
        </div>
        <div id="calendar" class="calendar" style="margin-top: 12px"></div>
        <div id="calendarDetails" class="card" style="margin-top: 12px">
          <strong>日期详情</strong>
          <div id="calendarDetailsBody" class="hint">点击有高亮的日期查看单位名称。</div>
        </div>
      </section>

      <section id="panelNotice" class="card hidden">
        <h2>须知配置</h2>
        <p class="hint">以下内容会展示在“须知阅读”页面，默认可为空。</p>
        <label>须知内容</label>
        <textarea id="noticeContentInput" rows="10" placeholder="请输入须知内容，支持换行"></textarea>
        <div class="actions" style="margin-top: 10px">
          <button id="saveNoticeBtn" type="button">保存须知</button>
        </div>
      </section>

      <section id="panelAnalytics" class="card hidden">
        <h2>数据统计与报表导出</h2>
        <div class="analytics-container">
          <div class="filter-section">
            <div class="filter-row">
              <div>
                <label>开始日期</label>
                <input id="filterFromDate" type="date" />
              </div>
              <div>
                <label>结束日期</label>
                <input id="filterToDate" type="date" />
              </div>
              <button id="btnRefresh">查询</button>
              <button id="btnExport" class="btn-export">导出 CSV</button>
            </div>
          </div>

          <div class="dashboard-grid">
            <div class="stat-card">
              <h3>总申请数</h3>
              <div class="value" id="statTotal">-</div>
              <div class="subtext">本期统计</div>
            </div>
            <div class="stat-card stat-pending">
              <h3>待审批</h3>
              <div class="value" id="statPending">-</div>
              <div class="subtext">未处理</div>
            </div>
            <div class="stat-card stat-approved">
              <h3>已通过</h3>
              <div class="value" id="statApproved">-</div>
              <div class="subtext" id="approvalRateText">通过率 -%</div>
            </div>
            <div class="stat-card stat-rejected">
              <h3>已驳回</h3>
              <div class="value" id="statRejected">-</div>
              <div class="subtext">需补充</div>
            </div>
          </div>

          <div class="charts-section">
            <div class="chart-card">
              <h3>审批状态分布</h3>
              <div class="status-chart" id="statusChart">
                <div class="loading" style="width:100%;text-align:center">加载中...</div>
              </div>
            </div>
            <div class="chart-card">
              <h3>时间趋势（过去30天）</h3>
              <div class="timeline-chart" id="timelineChart">
                <div class="loading" style="text-align:center;padding-top:80px">加载中...</div>
              </div>
            </div>
          </div>

          <div class="field-stats-section">
            <h3>按字段统计</h3>
            <div class="field-selector">
              <label>选择字段</label>
              <select id="fieldSelect">
                <option value="">-- 选择要统计的字段 --</option>
              </select>
            </div>
            <div id="fieldStatsContent"></div>
          </div>
        </div>
      </section>

      <p id="adminMsg"></p>
    </div>
    <script src="./analytics.js"></script>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
